services:
  postgres:
    image: postgres:16-alpine
    container_name: crossly-postgres
    environment:
      POSTGRES_DB: crossly
      POSTGRES_USER: crossly
      POSTGRES_PASSWORD: crossly_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
