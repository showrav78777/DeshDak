name: deshdak-production

# This consumes reviewed images and an external secret file. It provisions no
# cloud resources, database, TLS certificates, scanner or payment credentials.
services:
  app:
    image: ${DESHDAK_IMAGE:?Set DESHDAK_IMAGE to a reviewed release image}
    env_file:
      - ${DESHDAK_ENV_FILE:?Set DESHDAK_ENV_FILE to an external production secret file}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
      - /app/.next/cache:rw,noexec,nosuid,size=256m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${DESHDAK_MIGRATION_IMAGE:?Set DESHDAK_MIGRATION_IMAGE to the matching reviewed migration image}
    profiles: [migration]
    env_file:
      - ${DESHDAK_ENV_FILE:?Set DESHDAK_ENV_FILE to an external production secret file}
    environment:
      NODE_ENV: production
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"
    mem_limit: 1g
    pids_limit: 128
