name: Private inspection video component

on:
  workflow_dispatch:
    inputs:
      real_engine:
        description: Include the real ClamAV engine and signature-update acceptance
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - services/inspection-video/**
      - services/media-scanner/clamd.mjs
      - src/modules/private-storage/video-processing.ts
      - src/modules/private-storage/video-artifacts.ts
      - src/modules/private-storage/photos.ts
      - scripts/verify-private-video-artifacts.mjs
      - src/modules/private-storage/video-preview.ts
      - src/modules/private-storage/video-preview-response.ts
      - src/modules/private-storage/video-byte-range.ts
      - scripts/lib/private-video-preview-acceptance.mjs
      - src/modules/private-storage/video-evidence.ts
      - src/modules/private-storage/video-provenance.ts
      - scripts/verify-private-video-evidence.mjs
      - src/modules/private-storage/video-intake.ts
      - src/modules/private-storage/video-authorization.ts
      - scripts/verify-private-video-intake.mjs
      - src/modules/private-storage/video-jobs.ts
      - scripts/verify-private-video-jobs.mjs
      - prisma/schema.prisma
      - prisma/migrations/**
      - scripts/verify-inspection-video-component.mjs
      - scripts/verify-inspection-video-engine.mjs
      - package.json
      - .dockerignore
      - .github/workflows/private-video.yml
  push:
    branches: [main, codex/deshdak-platform]
    paths:
      - services/inspection-video/**
      - services/media-scanner/clamd.mjs
      - src/modules/private-storage/video-processing.ts
      - src/modules/private-storage/video-artifacts.ts
      - src/modules/private-storage/photos.ts
      - scripts/verify-private-video-artifacts.mjs
      - src/modules/private-storage/video-preview.ts
      - src/modules/private-storage/video-preview-response.ts
      - src/modules/private-storage/video-byte-range.ts
      - scripts/lib/private-video-preview-acceptance.mjs
      - src/modules/private-storage/video-evidence.ts
      - src/modules/private-storage/video-provenance.ts
      - scripts/verify-private-video-evidence.mjs
      - src/modules/private-storage/video-intake.ts
      - src/modules/private-storage/video-authorization.ts
      - scripts/verify-private-video-intake.mjs
      - src/modules/private-storage/video-jobs.ts
      - scripts/verify-private-video-jobs.mjs
      - prisma/schema.prisma
      - prisma/migrations/**
      - scripts/verify-inspection-video-component.mjs
      - scripts/verify-inspection-video-engine.mjs
      - package.json
      - .dockerignore
      - .github/workflows/private-video.yml

permissions:
  contents: read

concurrency:
  group: private-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wrapper uses only Node built-ins; FFmpeg/client tests run in Docker.
      # No database, cloud credentials, registry publishing or deployment occurs.
      - name: Verify isolated video processing
        run: npm run test:inspection-video-component
      - name: Check real-engine runner syntax
        run: node --check scripts/verify-inspection-video-engine.mjs
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_verify
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic_ci_video_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d video_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify private artifact storage with synthetic loopback S3
        run: npm run test:private-video-artifacts
      - name: Select a generated schema in the ephemeral CI database
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");
          const schema="crossly_launch_verify_"+crypto.randomBytes(8).toString("hex");
          fs.appendFileSync(process.env.GITHUB_ENV,"DATABASE_URL=postgresql://synthetic:synthetic_ci_video_password@localhost:5432/video_verify?schema="+schema+"\n");'
      - name: Prepare the generated client and disposable database
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Verify durable video jobs and interrupted-write recovery
        run: |
          npm run test:private-video-jobs
          npm run test:private-video-intake
  real-engine:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_engine }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real ClamAV and video processing with synthetic data
        run: npm run test:inspection-video-engine
