name: Private inspection video component

on:
  workflow_dispatch:
    inputs:
      real_engine:
        description: Include the real ClamAV engine and signature-update acceptance
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - services/inspection-video/**
      - services/media-scanner/clamd.mjs
      - src/modules/private-storage/video-processing.ts
      - src/modules/private-storage/video-artifacts.ts
      - src/modules/private-storage/photos.ts
      - scripts/verify-private-video-artifacts.mjs
      - scripts/verify-inspection-video-component.mjs
      - scripts/verify-inspection-video-engine.mjs
      - package.json
      - .dockerignore
      - .github/workflows/private-video.yml
  push:
    branches: [main, codex/deshdak-platform]
    paths:
      - services/inspection-video/**
      - services/media-scanner/clamd.mjs
      - src/modules/private-storage/video-processing.ts
      - src/modules/private-storage/video-artifacts.ts
      - src/modules/private-storage/photos.ts
      - scripts/verify-private-video-artifacts.mjs
      - scripts/verify-inspection-video-component.mjs
      - scripts/verify-inspection-video-engine.mjs
      - package.json
      - .dockerignore
      - .github/workflows/private-video.yml

permissions:
  contents: read

concurrency:
  group: private-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wrapper uses only Node built-ins; FFmpeg/client tests run in Docker.
      # No database, cloud credentials, registry publishing or deployment occurs.
      - name: Verify isolated video processing
        run: npm run test:inspection-video-component
      - name: Check real-engine runner syntax
        run: node --check scripts/verify-inspection-video-engine.mjs
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify private artifact storage with synthetic loopback S3
        run: npm run test:private-video-artifacts
  real-engine:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_engine }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real ClamAV and video processing with synthetic data
        run: npm run test:inspection-video-engine
